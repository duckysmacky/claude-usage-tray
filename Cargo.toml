[package]
name = "claude-usage-tray"
version = "1.1.0"
edition = "2024"
description = "A simple tray application for Linux to show Claude's usage"
license = "MIT"
readme = "README.md"
repository = "https://github.com/duckysmacky/claude-usage-tray"
keywords = ["claude", "tray", "system-tray", "linux", "status-notifier-item"]
categories = ["command-line-utilities"]
exclude = ["assets/screenshot.png"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = "0.3.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
